services:
  ubuntu:
    container_name: ubuntu-calculix
    build: ubuntu-calculix
    user: ubuntu
    working_dir: /home/ubuntu
    command: /bin/bash
    tty: true
    volumes:
      - ./ubuntu-calculix/examples:/home/ubuntu/examples
      - /home/valdir/000_VALDIR/00_CAE/FemEDSS/FemEDSS-app/uploads:/home/ubuntu/work
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    secrets:
      - user_password

secrets:
  user_password:
    file: secret.txt