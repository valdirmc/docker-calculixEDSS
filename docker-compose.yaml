services:
  ubuntu:
    container_name: ubuntu-calculix
    build: ubuntu-calculix
    user: ubuntu
    working_dir: /home/ubuntu
    command: /bin/bash
    tty: true
    volumes:
      - ./ubuntu-calculix/examples:/home/ubuntu/examples
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/media/valdir/MAIN/000_VALDIR/GIT_PJR/FemEDSS/FemEDSS-app/uploads:/run/media/valdir/MAIN/000_VALDIR/GIT_PJR/FemEDSS/FemEDSS-app/uploads
    environment:
      - DISPLAY=${DISPLAY}
    networks:
      - mynet
    secrets:
      - user_password

secrets:
  user_password:
    file: secret.txt

networks:
  mynet:
    driver: bridge